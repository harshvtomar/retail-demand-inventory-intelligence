name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test and analysis dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run independent, synthetic-fixture tests (no Kaggle access required)
        env:
          MPLBACKEND: Agg
          PYTHONPATH: .
        run: python -m pytest -q
